# =============================================================================
# Gradual Traffic Migration: Node.js → Go Backend
# =============================================================================
# This config enables weighted load balancing between Node.js and Go backend
# 
# Usage:
#   1. Start with 10% traffic to Go: weight=1 vs weight=9
#   2. Increase to 50%: weight=1 vs weight=1
#   3. Final 100%: remove Node.js from upstream
#
# To apply changes:
#   docker exec omni-nginx nginx -s reload
# =============================================================================

# Backend upstream with weighted load balancing
upstream api_backend {
    # =========================================================================
    # TRAFFIC SPLIT CONFIGURATION
    # =========================================================================
    # 
    # Phase 1: 10% Go, 90% Node.js
    # server backend-go:8080 weight=1;
    # server backend:3000 weight=9;
    #
    # Phase 2: 50% Go, 50% Node.js
    # server backend-go:8080 weight=1;
    # server backend:3000 weight=1;
    #
    # Phase 3: 100% Go (Final)
    # server backend-go:8080;
    # =========================================================================
    
    # CURRENT: Phase 1 - 10% traffic to Go backend
    server backend-go:8080 weight=1;
    server backend:3000 weight=9;
    
    # Connection settings
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' data: https://static.cloudflareinsights.com https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' http://localhost:* ws://localhost:* https://yndigital.my.id https://*.yndigital.my.id wss://yndigital.my.id https://www.google.com; frame-src 'self' https://www.google.com; frame-ancestors 'self';" always;

    # Gzip - serve pre-compressed .gz files from build
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss;

    # Static assets - NO CACHE
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|avif)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        access_log off;
    }

    # JS/CSS - NO CACHE
    location ~* \.(css|js|ts|mts)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        access_log off;
        gzip_static on;
    }

    # Fonts - NO CACHE
    location ~* \.(woff|woff2|ttf|eot)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
        access_log off;
    }

    # Main application - serves index.html with security headers
    location / {
        try_files $uri $uri/ /index.html;
        
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' data: https://static.cloudflareinsights.com https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' http://localhost:* ws://localhost:* https://yndigital.my.id https://yndigital.my.id:3000 https://*.yndigital.my.id wss://yndigital.my.id https://www.google.com; frame-src 'self' https://www.google.com; frame-ancestors 'self';" always;
    }

    # HTML files
    location ~* \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }

    # ==========================================================================
    # API PROXY WITH LOAD BALANCING
    # ==========================================================================
    location /api {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Add header to track which backend served the request
        add_header X-Backend-Server $upstream_addr always;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}
