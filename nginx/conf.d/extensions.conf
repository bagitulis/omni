# extensions.yndigital.my.id - AutoFlow Extensions
# Go server on host port 8080 (embedded Svelte frontend)

server {
    listen 80;
    server_name extensions.yndigital.my.id;

    resolver 10.89.0.1 valid=10s;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

    location = /health {
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # WebSocket
    location = /ws {
        proxy_pass http://172.25.48.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }

    # All traffic → Go server (port 8080, serves both API + Svelte SPA)
    location / {
        proxy_pass http://172.25.48.1:8080;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
    }

    location ~ /\.(env|git|log) {
        deny all;
        return 404;
    }
}
