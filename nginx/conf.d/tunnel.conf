# ============================================
# Nginx config untuk Cloudflare Tunnel
# SSL sudah di-handle oleh Cloudflare
# ============================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ============================================
    # Health Check (untuk Docker)
    # ============================================
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ============================================
    # Webhooks - No rate limiting, Platform callbacks
    # ============================================
    location /api/webhooks {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header Content-Type $content_type;
        
        proxy_buffering off;
        proxy_request_buffering off;
        
        # Longer timeout for webhook processing
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ============================================
    # OAuth Callbacks - No rate limiting
    # ============================================
    location /api/platform-auth {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        
        proxy_buffering off;
        
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ============================================
    # API Backend
    # UPDATED: Variable-based proxy untuk auto-detect backend IP changes
    # ============================================
    location /api {
        limit_req zone=api_limit burst=20 nodelay;
        limit_conn conn_limit 10;

        # Variable-based proxy: DNS selalu di-resolve fresh (bypass upstream cache)
        set $backend_upstream backend:3000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ============================================
    # Static image serving for uploads
    # ============================================
    location /uploads/ {
        alias /app/uploads/;
        
        # Cache headers - 30 days, immutable
        add_header Cache-Control "public, max-age=2592000, immutable";
        
        # CORS headers for images
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        
        # Disable directory listing
        autoindex off;
        
        # Try files, return 404 if not found
        try_files $uri =404;
        
        # Specific handling for WebP
        location ~* \.webp$ {
            add_header Cache-Control "public, max-age=2592000, immutable";
            add_header Content-Type "image/webp";
            add_header Access-Control-Allow-Origin "*";
        }
        
        # Handle other image formats
        location ~* \.(jpg|jpeg|png|gif)$ {
            add_header Cache-Control "public, max-age=2592000, immutable";
            add_header Access-Control-Allow-Origin "*";
        }
    }

    # ============================================
    # React Frontend Application (New)
    # Path-based routing: /v2/* → React app
    # ============================================
    location /v2/ {
        limit_req zone=general_limit burst=50 nodelay;
        
        # Variable-based proxy to React dev server
        set $frontend_react_upstream frontend-react:5173;
        proxy_pass http://$frontend_react_upstream;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        
        proxy_cache_bypass $http_upgrade;
        
        # SPA routing: rewrite URLs for React Router
        error_page 404 = /v2/;
        try_files $uri $uri/ /v2/index.html;
    }

    # ============================================
    # Vue Frontend Application (Legacy)
    # Path-based routing: /* → Vue app
    # ============================================
    location / {
        limit_req zone=general_limit burst=50 nodelay;
        
        # Variable-based proxy: DNS selalu di-resolve fresh
        set $frontend_upstream frontend:80;
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        
        proxy_cache_bypass $http_upgrade;
    }

    # ============================================
    # Security - Deny access to sensitive files
    # ============================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(env|git|gitignore|htaccess|htpasswd|ini|log|sh|sql|conf|bak)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
