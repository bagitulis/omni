# Map for parameterized CORS origin (echo requesting origin if present)
map $http_origin $cors_origin {
    default "";
    "~.+" $http_origin;
}

# ============================================
# Nginx config untuk Cloudflare Tunnel
# SSL sudah di-handle oleh Cloudflare
# ============================================

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ============================================
    # Health Check (untuk Docker)
    # ============================================
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # ============================================
    # Webhooks - No rate limiting, Platform callbacks
    # ============================================
    location /api/webhooks {
        # Variable-based proxy: DNS resolved at runtime
        set $backend_upstream backend:3000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header Content-Type $content_type;
        
        proxy_buffering off;
        proxy_request_buffering off;
        
        # Longer timeout for webhook processing
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ============================================
    # OAuth Callbacks - No rate limiting
    # ============================================
    location /api/platform-auth {
        # Variable-based proxy: DNS resolved at runtime
        set $backend_upstream backend:3000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        
        proxy_buffering off;
        
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ============================================
    # Platform Sync & Import — Extended timeout (5 min)
    # Sync fetches ALL products from marketplace API (paginated),
    # Import processes staging data with cleanup operations.
    # Both take 2-5 minutes for shops with 80+ products.
    # ============================================
    location ~ ^/api/(shopee|lazada|tiktok)/sync {
        limit_req zone=api_limit burst=20 nodelay;
        limit_conn conn_limit 10;

        set $backend_upstream backend:3000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        proxy_buffering off;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location ~ ^/api/master-products/import {
        limit_req zone=api_limit burst=20 nodelay;
        limit_conn conn_limit 10;

        set $backend_upstream backend:3000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        proxy_buffering off;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # ============================================
    # API Backend — Standard timeout (60s)
    # Variable-based proxy untuk auto-detect backend IP changes
    # ============================================
    location /api {
        limit_req zone=api_limit burst=20 nodelay;
        limit_conn conn_limit 10;

        # Variable-based proxy: DNS selalu di-resolve fresh (bypass upstream cache)
        set $backend_upstream backend:3000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ============================================
    # Static image serving for uploads
    # ============================================
    location /uploads/ {
        alias /app/uploads/;
        
        # Cache headers - 30 days, immutable
        add_header Cache-Control "public, max-age=2592000, immutable";
        
        # CORS headers for images
        # CORS headers for images (parameterized origin)
        if ($cors_origin) {
            add_header Access-Control-Allow-Origin $cors_origin;
        }
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
        
        # Disable directory listing
        autoindex off;
        
        # Try files, return 404 if not found
        try_files $uri =404;
        
        # Specific handling for WebP
        location ~* \.webp$ {
            add_header Cache-Control "public, max-age=2592000, immutable";
            add_header Content-Type "image/webp";
            if ($cors_origin) {
                add_header Access-Control-Allow-Origin $cors_origin;
            }
        }
        
        # Handle other image formats
        location ~* \.(jpg|jpeg|png|gif)$ {
            add_header Cache-Control "public, max-age=2592000, immutable";
            if ($cors_origin) {
                add_header Access-Control-Allow-Origin $cors_origin;
            }
        }
    }

    # ============================================
    # React Frontend Application (Default)
    # Path-based routing: /* → React app
    # ============================================
    location / {
        limit_req zone=general_limit burst=50 nodelay;
        
        # Variable-based proxy to React production build (primary frontend)
        set $frontend_upstream frontend:80;
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        
        proxy_cache_bypass $http_upgrade;
        
        # SPA routing handled by frontend container's nginx
        proxy_intercept_errors off;
    }

    # ============================================
    # Security - Deny access to sensitive files
    # ============================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(env|git|gitignore|htaccess|htpasswd|ini|log|sh|sql|conf|bak)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
