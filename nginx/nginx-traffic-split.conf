# Nginx Configuration for Gradual Traffic Migration
# Node.js (legacy) → Go (new) Backend
#
# Traffic Split Levels:
# - Level 1: 10% Go, 90% Node.js (Initial testing)
# - Level 2: 50% Go, 50% Node.js (Parallel running)
# - Level 3: 100% Go, 0% Node.js (Full migration)
#
# To change traffic split, modify the $backend_pool variable below

# ============================================================
# TRAFFIC SPLIT CONFIGURATION
# ============================================================
# Uncomment ONE of the following split_clients blocks

# Level 1: 10% Go (Testing phase)
split_clients "${request_id}" $backend_pool {
    10%     go_backend;
    *       nodejs_backend;
}

# Level 2: 50% Go (Parallel running)
# split_clients "${request_id}" $backend_pool {
#     50%     go_backend;
#     *       nodejs_backend;
# }

# Level 3: 100% Go (Full migration)
# split_clients "${request_id}" $backend_pool {
#     *       go_backend;
# }

# ============================================================
# UPSTREAM DEFINITIONS
# ============================================================

upstream nodejs_backend {
    server backend:3000;
    keepalive 32;
}

upstream go_backend {
    server backend-go:8080;
    keepalive 64;  # Go handles more connections efficiently
}

# ============================================================
# MAP FOR BACKEND SELECTION
# ============================================================

# Force specific endpoints to specific backends
map $uri $forced_backend {
    default "";
    
    # Force these endpoints to Node.js (not yet migrated)
    ~^/api/webhooks       nodejs_backend;
    ~^/api/auth           nodejs_backend;
    
    # Force these endpoints to Go (fully tested)
    # ~^/api/health         go_backend;
    # ~^/api/shopee/orders  go_backend;
}

# Final backend selection
map $forced_backend $selected_backend {
    ""      $backend_pool;
    default $forced_backend;
}

# ============================================================
# SERVER CONFIGURATION
# ============================================================

server {
    listen 80;
    server_name localhost yndigital.my.id;
    
    # Logging with backend info
    log_format backend_log '$remote_addr - $remote_user [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          '"$http_referer" "$http_user_agent" '
                          'backend=$selected_backend rt=$request_time';
    
    access_log /var/log/nginx/access.log backend_log;
    error_log /var/log/nginx/error.log warn;

    # Frontend static files
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        
        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # API routes - traffic split between Node.js and Go
    location /api/ {
        # Add header to identify which backend served the request
        add_header X-Backend-Server $selected_backend always;
        
        # Proxy to selected backend
        proxy_pass http://$selected_backend;
        
        # Standard proxy headers
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        
        # Tenant ID header passthrough
        proxy_set_header x-tenant-id $http_x_tenant_id;
        
        # Timeouts
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # Health check endpoint - always available
    location = /health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Nginx status (internal only)
    location = /nginx-status {
        stub_status on;
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny all;
    }
}

# ============================================================
# HTTPS SERVER (Production)
# ============================================================

server {
    listen 443 ssl http2;
    server_name yndigital.my.id;
    
    ssl_certificate /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    
    # Same locations as HTTP
    include /etc/nginx/conf.d/locations.conf;
}
