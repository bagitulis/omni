# Host-level logrotate configuration for OMNI nginx access and error logs.
#
# Installation (run on Docker host):
#   sudo cp nginx/logrotate.conf /etc/logrotate.d/omni-nginx
#
# This is installed automatically by scripts/docker-host-setup.sh (T14).

/opt/omni/nginx/logs/*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 0640 root root
    sharedscripts
    postrotate
        # Signal nginx container to reopen log files
        docker exec omni-nginx nginx -s reopen 2>/dev/null || true
    endscript
}
