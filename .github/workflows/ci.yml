name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: backend/go.sum

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('backend/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Security Middleware Coverage Gate
        run: |
          go test -v -race -coverprofile=coverage-middleware.out ./internal/middleware
          go tool cover -func=coverage-middleware.out
          COVERAGE=$(go tool cover -func=coverage-middleware.out | awk '/^total:/ {gsub("%", "", $3); print $3}')
          awk -v cov="$COVERAGE" 'BEGIN { if (cov+0 < 45) { printf("Security middleware coverage %.2f%% is below 45%% threshold\n", cov); exit 1 } }'

      - name: Test (Non-runtime packages)
        run: go test -v -race ./cmd/... ./internal/... ./pkg/... ./lazada-sdk ./shopee-sdk ./scripts/...

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  runtime-strict:
    name: Runtime Strict (Security, Integration, E2E, Lighthouse)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: backend/go.sum

      - name: Start Docker Compose
        run: |
          docker compose -f docker-compose.tunnel.yml up -d \
            postgres redis backend frontend nginx
        env:
          ENCRYPTION_KEY: ci-test-encryption-key-32chars!!
          JWT_SECRET: ci-test-jwt-secret
          JWT_REFRESH_SECRET: ci-test-jwt-refresh-secret

      - name: Wait for services
        run: |
          backend_ready=0
          frontend_ready=0
          echo "Waiting for backend health..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Backend healthy after ${i}s"
              backend_ready=1
              break
            fi
            sleep 2
          done
          if [ "$backend_ready" -ne 1 ]; then
            echo "Backend failed readiness check"
            docker compose -f docker-compose.tunnel.yml logs backend
            exit 1
          fi

          echo "Waiting for frontend /login..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5174/login > /dev/null 2>&1; then
              echo "Frontend healthy after ${i}s"
              frontend_ready=1
              break
            fi
            sleep 2
          done
          if [ "$frontend_ready" -ne 1 ]; then
            echo "Frontend failed readiness check"
            docker compose -f docker-compose.tunnel.yml logs frontend
            exit 1
          fi

      - name: Run strict runtime backend suites
        working-directory: backend
        env:
          TEST_STRICT: "1"
          TEST_BASE_URL: "http://localhost:3000"
          TEST_USERNAME: "tester"
          TEST_PASSWORD: "tester@123"
        run: |
          go test -v ./tests/integration/...
          go test -v ./tests/security/...
          go test -v ./tests/e2e

      - name: Run Lighthouse tests
        working-directory: backend
        env:
          LIGHTHOUSE_STRICT: "1"
        run: go test -v ./tests/e2e/lighthouse/

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: backend/tests/e2e/lighthouse/test-results/
          retention-days: 7

      - name: Stop Docker Compose
        if: always()
        run: docker compose -f docker-compose.tunnel.yml down
