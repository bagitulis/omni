name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: backend/go.sum

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('backend/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Security Middleware Coverage Gate
        run: |
          go test -v -race -coverprofile=coverage-middleware.out ./internal/middleware
          go tool cover -func=coverage-middleware.out
          COVERAGE=$(go tool cover -func=coverage-middleware.out | awk '/^total:/ {gsub("%", "", $3); print $3}')
          awk -v cov="$COVERAGE" 'BEGIN { if (cov+0 < 45) { printf("Security middleware coverage %.2f%% is below 45%% threshold\n", cov); exit 1 } }'

      - name: Test (Non-runtime packages)
        run: go test -v -race ./cmd/... ./internal/... ./pkg/... ./lazada-sdk ./shopee-sdk ./scripts/...

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  runtime-strict:
    name: Runtime Strict (Security, Integration, E2E, Lighthouse)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache-dependency-path: backend/go.sum

      - name: Start Docker Compose
        run: |
          docker compose -f docker-compose.tunnel.yml up -d \
            postgres redis backend frontend nginx
        env:
          ENCRYPTION_KEY: ci-test-encryption-key-32chars!!
          JWT_SECRET: ci-test-jwt-secret
          JWT_REFRESH_SECRET: ci-test-jwt-refresh-secret

      - name: Wait for services
        run: |
          backend_ready=0
          frontend_ready=0
          echo "Waiting for backend health..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Backend healthy after ${i}s"
              backend_ready=1
              break
            fi
            sleep 2
          done
          if [ "$backend_ready" -ne 1 ]; then
            echo "Backend failed readiness check"
            docker compose -f docker-compose.tunnel.yml logs backend
            exit 1
          fi

          echo "Waiting for frontend /login..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:5174/login > /dev/null 2>&1; then
              echo "Frontend healthy after ${i}s"
              frontend_ready=1
              break
            fi
            sleep 2
          done
          if [ "$frontend_ready" -ne 1 ]; then
            echo "Frontend failed readiness check"
            docker compose -f docker-compose.tunnel.yml logs frontend
            exit 1
          fi

      - name: Run strict runtime backend suites
        working-directory: backend
        env:
          TEST_STRICT: "1"
          TEST_BASE_URL: "http://localhost:3000"
          TEST_USERNAME: "tester"
          TEST_PASSWORD: "tester@123"
        run: |
          go test -v ./tests/integration/...
          go test -v ./tests/security/...
          go test -v ./tests/e2e

      - name: Run Lighthouse tests
        working-directory: backend
        env:
          LIGHTHOUSE_STRICT: "1"
        run: go test -v ./tests/e2e/lighthouse/

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: backend/tests/e2e/lighthouse/test-results/
          retention-days: 7

      - name: Stop Docker Compose
        if: always()
        run: docker compose -f docker-compose.tunnel.yml down

  test-e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [runtime-strict]
    # Non-blocking during Phase 0 stabilisation. Convert to a required check
    # once Phase 2 unskips the 24 placeholder tests and Phase 4 exercises the
    # new realtime hooks. Tracking:
    # docs/superpowers/specs/2026-09-15-realtime-e2e-platform-drift-design.md
    continue-on-error: true
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start Docker Compose (backend + frontend)
        run: |
          docker compose -f docker-compose.tunnel.yml up -d \
            postgres redis backend frontend nginx
        env:
          ENCRYPTION_KEY: ci-test-encryption-key-32chars!!
          JWT_SECRET: ci-test-jwt-secret
          JWT_REFRESH_SECRET: ci-test-jwt-refresh-secret

      - name: Wait for frontend :5174
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5174/login > /dev/null 2>&1; then
              echo "Frontend :5174 ready after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "Frontend :5174 did not become ready in time"
          docker compose -f docker-compose.tunnel.yml logs frontend
          exit 1

      - name: Run Playwright
        working-directory: frontend
        env:
          CI: "true"
          TEST_USERNAME: tester
          TEST_PASSWORD: tester@123
        run: npx playwright test --reporter=list,html

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Stop Docker Compose
        if: always()
        run: docker compose -f docker-compose.tunnel.yml down

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: deploy
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "${VPS_HOST}" ]; then
            echo "VPS_HOST secret must be set" >&2
            exit 1
          fi
          if [ -z "${VPS_SSH_KEY}" ]; then
            echo "VPS_SSH_KEY secret must be set" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${VPS_SSH_KEY}" > ~/.ssh/omni_deploy_key
          chmod 600 ~/.ssh/omni_deploy_key
          ssh-keyscan -H "${VPS_HOST}" >> ~/.ssh/known_hosts

      - name: Validate deployment environment
        shell: bash
        env:
          DEPLOY_TARGET: vps
          DEPLOY_PROFILE: production
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
        run: |
          missing=0
          for name in VPS_HOST VPS_USER VPS_DEPLOY_PATH DOMAIN_NAME; do
            if [ -z "${!name}" ]; then
              echo "${name} secret must be set" >&2
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi
          bash scripts/validate-env.sh

      - name: Rsync repository to VPS
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          rsync_args=(
            -az
            --delete
            --exclude='.git/'
            --exclude='node_modules/'
            --exclude='.env'
            --exclude='*.log'
            --exclude='backups/'
            -e "ssh -i ~/.ssh/omni_deploy_key -o StrictHostKeyChecking=yes -o ConnectTimeout=10"
            ./
            "${VPS_USER}@${VPS_HOST}:${VPS_DEPLOY_PATH}/"
          )
          for attempt in 1 2; do
            if rsync "${rsync_args[@]}"; then
              exit 0
            fi
            if [ "${attempt}" -lt 2 ]; then
              echo "rsync failed; retrying once in 10s" >&2
              sleep 10
            fi
          done
          echo "rsync failed after retry" >&2
          exit 1

      - name: Remote Docker Compose up
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/omni_deploy_key -o StrictHostKeyChecking=yes -o ConnectTimeout=10 "${VPS_USER}@${VPS_HOST}" \
            "cd '${VPS_DEPLOY_PATH}' && docker compose -f docker-compose.tunnel.yml -f docker-compose.tunnel.highspec.yml up -d --build"

      - name: Health check
        id: health_check
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
        run: |
          deadline=$((SECONDS + 60))
          while [ "${SECONDS}" -lt "${deadline}" ]; do
            if curl -fsS "https://${DOMAIN_NAME}/api/health" >/dev/null; then
              echo "Remote health check passed"
              exit 0
            fi
            if ssh -i ~/.ssh/omni_deploy_key -o StrictHostKeyChecking=yes -o ConnectTimeout=10 "${VPS_USER}@${VPS_HOST}" \
              "curl -fsS http://localhost/api/health >/dev/null"; then
              echo "Remote localhost health check passed"
              exit 0
            fi
            sleep 5
          done
          echo "Remote health check timed out after 60s" >&2
          exit 1

      - name: Notify health check failure
        if: failure() && steps.health_check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: 'Deployment health check failed after 60 seconds. Inspect the VPS Docker Compose logs and GitHub Actions deploy job output.'
            })
