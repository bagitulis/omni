# ============================================
# HIGH SPEC Override untuk Tunnel
# RAM: 8GB+, CPU: 4+ cores
# Use: docker-compose -f docker-compose.tunnel.yml -f docker-compose.tunnel.highspec.yml up
# ============================================

services:
  backend:
    environment:
      - NODE_OPTIONS=--max-old-space-size=2048
    deploy:
      resources:
        limits:
          cpus: "3"
          memory: 2560M
        reservations:
          cpus: "1"
          memory: 1024M

  frontend:
    environment:
      - NODE_OPTIONS=--max-old-space-size=768
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 768M
        reservations:
          cpus: "0.25"
          memory: 256M

  redis:
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123} --maxmemory 512mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  nginx:
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M
