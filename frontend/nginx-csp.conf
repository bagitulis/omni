# =============================================================================
# Content Security Policy (CSP) — Single source of truth
# =============================================================================
# Included by nginx-default.conf in all location blocks that need CSP headers.
# Domain is parameterized via $host (derived from request Host header).
# =============================================================================
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' data: https://static.cloudflareinsights.com https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' http://localhost:* ws://localhost:* https://$host https://$host:3000 https://*.$host wss://$host https://www.google.com; frame-src 'self' https://www.google.com; frame-ancestors 'self';" always;
