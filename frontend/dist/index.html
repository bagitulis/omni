      :root {
        font-family:

        --base-100: #ffffff;
        --base-content: #1f2937;
        --color-primary: #3b82f6;
        --color-bg-primary: #ffffff;
        --color-text-primary: #1f2937;
        --color-border: #e5e7eb;
      }

      html {

        scroll-behavior: smooth;
        font-size: 16px;
      }

      body {
        margin: 0;
        padding: 0;
        background-color: var(--base-100);
        color: var(--base-content);
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        overflow-x: hidden;
        line-height: 1.5;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      #app {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      img {
        max-width: 100%;
        height: auto;
      }

      /* Critical layout styles for above-the-fold */
      .dashboard {
        display: flex;
        min-height: 100vh;
      }
      .sidebar {
        width: 256px;
        flex-shrink: 0;
        background: var(--color-bg-primary);
        border-right: 1px solid var(--color-border);
      }
      .main-content {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .navbar {
        height: 64px;
        background: var(--color-bg-primary);
        border-bottom: 1px solid var(--color-border);
        display: flex;
        align-items: center;
        padding: 0 1rem;
      }

      /* Loading skeleton for perceived performance */
      .skeleton {
        background: linear-gradient(
          90deg,
          #f0f0f0 25%,
          #e0e0e0 50%,
          #f0f0f0 75%
        );
        background-size: 200% 100%;
        animation: skeleton-loading 1.5s infinite;
      }
      @keyframes skeleton-loading {
        0% {
          background-position: 200% 0;
        }
        100% {
          background-position: -200% 0;
        }
      }
    </style>
